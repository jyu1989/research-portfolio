<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580">
<style>
text{font-family:Inter,Arial,sans-serif;fill:#171717}
.title{font-size:34px;font-weight:800}
.label{font-size:23px;font-weight:700}
.small{font-size:19px;fill:#66625d}
</style>
<rect width="1400" height="580" rx="28" fill="#f7f5f2"/>
<text x="70" y="68" class="title">One study, two levels of employee experience</text>
<text x="70" y="106" class="small">Experience sampling captures both daily change and stable differences across people.</text>

<rect x="90" y="175" width="560" height="300" rx="24" fill="#ffffff" stroke="#dedad4"/>
<text x="370" y="220" text-anchor="middle" class="label">Level 1 · Within person</text>
<text x="370" y="260" text-anchor="middle" class="small">How does the same employee change day to day?</text>
<polyline points="145,390 190,355 235,405 280,320 325,370 370,305 415,345 460,290 505,330 550,275 595,305"
          fill="none" stroke="#3f5f56" stroke-width="5"/>
<text x="370" y="440" text-anchor="middle" class="small">Daily social distancing → daily loneliness</text>

<rect x="750" y="175" width="560" height="300" rx="24" fill="#e7eeeb" stroke="#cdd8d3"/>
<text x="1030" y="220" text-anchor="middle" class="label">Level 2 · Between person</text>
<text x="1030" y="260" text-anchor="middle" class="small">Who experiences more cumulative distance over time?</text>
<circle cx="860" cy="340" r="42" fill="#ffffff" stroke="#3f5f56" stroke-width="3"/>
<circle cx="970" cy="315" r="42" fill="#ffffff" stroke="#3f5f56" stroke-width="3"/>
<circle cx="1080" cy="365" r="42" fill="#ffffff" stroke="#3f5f56" stroke-width="3"/>
<circle cx="1190" cy="300" r="42" fill="#ffffff" stroke="#3f5f56" stroke-width="3"/>
<text x="1030" y="440" text-anchor="middle" class="small">Average distancing → chronic loneliness → engagement</text>
</svg>