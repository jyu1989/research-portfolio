<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<style>
text{font-family:Inter,Arial,sans-serif;fill:#171717}
.title{font-size:34px;font-weight:800}
.label{font-size:22px;font-weight:700}
.small{font-size:19px;fill:#66625d}
</style>
<rect width="1400" height="560" rx="28" fill="#f7f5f2"/>
<text x="70" y="70" class="title">One data stream, multiple feedback layers</text>
<text x="70" y="108" class="small">The design separated access and feedback by role and organizational level.</text>

<g transform="translate(90,180)">
<rect x="0" y="0" width="260" height="230" rx="22" fill="#fff" stroke="#dedad4"/>
<text x="130" y="48" text-anchor="middle" class="label">Individual</text>
<text x="130" y="90" text-anchor="middle" class="small">strengths &amp; development</text>
<text x="130" y="125" text-anchor="middle" class="small">network position</text>
<text x="130" y="160" text-anchor="middle" class="small">career guidance</text>

<rect x="320" y="0" width="260" height="230" rx="22" fill="#fff" stroke="#dedad4"/>
<text x="450" y="48" text-anchor="middle" class="label">Team</text>
<text x="450" y="90" text-anchor="middle" class="small">health dimensions</text>
<text x="450" y="125" text-anchor="middle" class="small">bottlenecks &amp; trends</text>
<text x="450" y="160" text-anchor="middle" class="small">key contributors</text>

<rect x="640" y="0" width="260" height="230" rx="22" fill="#fff" stroke="#dedad4"/>
<text x="770" y="48" text-anchor="middle" class="label">Leader</text>
<text x="770" y="90" text-anchor="middle" class="small">leadership style</text>
<text x="770" y="125" text-anchor="middle" class="small">context fit</text>
<text x="770" y="160" text-anchor="middle" class="small">development direction</text>

<rect x="960" y="0" width="260" height="230" rx="22" fill="#e7eeeb" stroke="#cdd8d3"/>
<text x="1090" y="48" text-anchor="middle" class="label">Organization</text>
<text x="1090" y="90" text-anchor="middle" class="small">team portfolio</text>
<text x="1090" y="125" text-anchor="middle" class="small">talent &amp; risk</text>
<text x="1090" y="160" text-anchor="middle" class="small">HR system insights</text>
</g>
</svg>