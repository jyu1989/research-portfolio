<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<style>
text{font-family:Inter,Arial,sans-serif;fill:#171717}
.small{font-size:21px;fill:#66625d}
.label{font-size:24px;font-weight:700}
.title{font-size:34px;font-weight:800}
</style>
<rect width="1400" height="650" rx="28" fill="#f7f5f2"/>
<text x="70" y="70" class="title">AI measurement &amp; human judgment</text>
<text x="70" y="108" class="small">Illustrative framework — no client data or results shown</text>

<rect x="70" y="160" width="560" height="340" rx="24" fill="#ffffff" stroke="#dedad4"/>
<text x="110" y="205" class="label">Human ratings</text>
<line x1="120" y1="445" x2="580" y2="445" stroke="#a7a29c" stroke-width="2"/>
<rect x="145" y="390" width="38" height="55" fill="#75867f"/>
<rect x="205" y="350" width="38" height="95" fill="#75867f"/>
<rect x="265" y="310" width="38" height="135" fill="#75867f"/>
<rect x="325" y="220" width="38" height="225" fill="#75867f"/>
<rect x="385" y="380" width="38" height="65" fill="#75867f"/>
<rect x="445" y="315" width="38" height="130" fill="#75867f"/>
<rect x="505" y="405" width="38" height="40" fill="#75867f"/>
<text x="110" y="485" class="small">Potential compression / rater habits</text>

<rect x="770" y="160" width="560" height="340" rx="24" fill="#ffffff" stroke="#dedad4"/>
<text x="810" y="205" class="label">AI-generated scores</text>
<line x1="820" y1="445" x2="1280" y2="445" stroke="#a7a29c" stroke-width="2"/>
<rect x="845" y="390" width="38" height="55" fill="#5f746b"/>
<rect x="905" y="360" width="38" height="85" fill="#5f746b"/>
<rect x="965" y="325" width="38" height="120" fill="#5f746b"/>
<rect x="1025" y="290" width="38" height="155" fill="#5f746b"/>
<rect x="1085" y="275" width="38" height="170" fill="#5f746b"/>
<rect x="1145" y="315" width="38" height="130" fill="#5f746b"/>
<rect x="1205" y="365" width="38" height="80" fill="#5f746b"/>
<text x="810" y="485" class="small">Different scale behavior can change interpretation</text>

<rect x="155" y="535" width="1090" height="72" rx="18" fill="#e7eeeb"/>
<text x="700" y="575" text-anchor="middle" class="label">When AI and human ratings disagree, are they measuring the same thing?</text>
</svg>