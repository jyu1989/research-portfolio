<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
<style>
text{font-family:Inter,Arial,sans-serif;fill:#171717}
.title{font-size:34px;font-weight:800}
.label{font-size:24px;font-weight:700}
.small{font-size:20px;fill:#66625d}
</style>
<rect width="1400" height="600" rx="28" fill="#f7f5f2"/>
<text x="70" y="70" class="title">Connecting science and practice</text>
<text x="70" y="108" class="small">SPAN was designed as a two-sided platform for organizations and researchers.</text>

<rect x="90" y="190" width="330" height="250" rx="24" fill="#ffffff" stroke="#dedad4"/>
<text x="255" y="235" text-anchor="middle" class="label">Organizations</text>
<text x="255" y="280" text-anchor="middle" class="small">Bring real business problems</text>
<text x="255" y="315" text-anchor="middle" class="small">Share relevant data</text>
<text x="255" y="350" text-anchor="middle" class="small">Seek evidence-based solutions</text>

<line x1="420" y1="315" x2="535" y2="315" stroke="#3f5f56" stroke-width="6"/>
<polygon points="535,315 515,303 515,327" fill="#3f5f56"/>

<rect x="550" y="155" width="300" height="320" rx="26" fill="#e7eeeb" stroke="#cdd8d3"/>
<text x="700" y="210" text-anchor="middle" class="label">SPAN</text>
<text x="700" y="250" text-anchor="middle" class="small">Problem formulation</text>
<text x="700" y="285" text-anchor="middle" class="small">Researcher matching</text>
<text x="700" y="320" text-anchor="middle" class="small">Data collection</text>
<text x="700" y="355" text-anchor="middle" class="small">Analysis &amp; evidence</text>
<text x="700" y="390" text-anchor="middle" class="small">Feedback &amp; reports</text>
<text x="700" y="430" text-anchor="middle" class="small">Research dissemination</text>

<line x1="850" y1="315" x2="965" y2="315" stroke="#3f5f56" stroke-width="6"/>
<polygon points="965,315 945,303 945,327" fill="#3f5f56"/>

<rect x="980" y="190" width="330" height="250" rx="24" fill="#ffffff" stroke="#dedad4"/>
<text x="1145" y="235" text-anchor="middle" class="label">Researchers</text>
<text x="1145" y="280" text-anchor="middle" class="small">Bring scientific expertise</text>
<text x="1145" y="315" text-anchor="middle" class="small">Study real phenomena</text>
<text x="1145" y="350" text-anchor="middle" class="small">Generate new knowledge</text>

<text x="700" y="535" text-anchor="middle" class="small">Platform goal: improve organizational decisions while creating publishable scientific knowledge.</text>
</svg>